name: Validate NIET Email Restriction

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run email validation tests
        run: |
          node --test tests/email.test.js
