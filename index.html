<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h2>Student Feedback Form</h2>
    <form id="feedbackForm" novalidate>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <small class="error-msg" id="nameError"></small>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
            <small class="error-msg" id="emailError"></small>
        </div>

        <div class="form-group">
            <label for="course">Course / Subject</label>
            <select id="course">
                <option value="">Select a course</option>
                <option value="math">Mathematics</option>
                <option value="science">Science</option>
                <option value="history">History</option>
                <option value="cs">Computer Science</option>
            </select>
            <small class="error-msg" id="courseError"></small>
        </div>

        <div class="form-group">
            <label for="rating">Teaching Quality</label>
            <select id="rating">
                <option value="">Rate the teaching</option>
                <option value="5">Excellent</option>
                <option value="4">Good</option>
                <option value="3">Average</option>
                <option value="2">Poor</option>
            </select>
            <small class="error-msg" id="ratingError"></small>
        </div>

        <div class="form-group">
            <label for="comments">Comments & Suggestions</label>
            <textarea id="comments" placeholder="Write your feedback here..."></textarea>
        </div>

        <button type="submit">Submit Feedback</button>
    </form>
</div>

<script src="validation.js"></script>
<script src="app.js"></script>
</body>
</html>
